name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          bin_name="cairn"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            bin_name="cairn.exe"
          fi

          out_dir="build/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${out_dir}"

          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w' -o "${out_dir}/${bin_name}" ./

          tar -czf "dist/cairn-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" -C "${out_dir}" "${bin_name}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cairn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cairn-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  publish-release:
    runs-on: ubuntu-latest
    needs: build-assets

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

name: Cairn Demo (uv + pytest + ruff + go)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: demo/uv-demo/uv.lock

      - name: Install demo dependencies
        run: uv sync --project demo/uv-demo --group dev

      - name: Run pytest (JUnit XML)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          PYTHONPATH=demo/uv-demo/src \
            uv run --project demo/uv-demo pytest --junitxml demo-artifacts/pytest-junit.xml

      - name: Run ruff (JSON)
        run: |
          PYTHONPATH=demo/uv-demo/src \
            uv run --project demo/uv-demo ruff check demo/uv-demo/src --output-format json --output-file demo-artifacts/ruff-results.json

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint (JSON)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          golangci-lint run --issues-exit-code=0 --out-format json > demo-artifacts/golangci-lint-results.json

      - name: Run Go typecheck (JSON stream)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          go test -run '^$' -json ./... > demo-artifacts/go-typecheck-results.json

      - name: Run Go tests (JSON stream)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          go test -json ./... > demo-artifacts/go-test-results.json

      - name: Build Cairn binary
        run: |
          mkdir -p bin
          go build -o ./bin/cairn ./

      - uses: ./
        with:
          cairn-path: ./bin/cairn
          collect-config: demo/uv-demo/cairn.toml
          collect-args: >-
            --matrix python=3.12
          deploy-pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}

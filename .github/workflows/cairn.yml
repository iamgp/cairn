name: Cairn Demo (uv + pytest + ruff)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install demo dependencies
        run: uv sync --project demo/uv-demo --group dev

      - name: Run pytest (JUnit XML)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          uv run --project demo/uv-demo pytest --junitxml demo-artifacts/pytest-junit.xml

      - name: Run ruff (JSON)
        run: |
          uv run --project demo/uv-demo ruff check demo/uv-demo/src --output-format json --output-file demo-artifacts/ruff-results.json

      - name: Build Cairn run record
        run: |
          mkdir -p bin
          go build -o ./bin/cairn ./
          ./bin/cairn collect \
            --config demo/uv-demo/cairn.toml \
            --out demo-artifacts/run-record.json \
            --run-id "${{ github.run_id }}-py312" \
            --sha-full "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --matrix "python=3.12"

      - uses: ./
        with:
          ingest-file: demo-artifacts/run-record.json

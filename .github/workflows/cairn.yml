name: Cairn Demo (uv + pytest + ruff)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install demo dependencies
        run: uv sync --project demo/uv-demo --group dev

      - name: Run pytest (JUnit XML)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          PYTHONPATH=demo/uv-demo/src \
            uv run --project demo/uv-demo pytest --junitxml demo-artifacts/pytest-junit.xml

      - name: Run ruff (JSON)
        run: |
          PYTHONPATH=demo/uv-demo/src \
            uv run --project demo/uv-demo ruff check demo/uv-demo/src --output-format json --output-file demo-artifacts/ruff-results.json

      - name: Build Cairn run record
        run: |
          mkdir -p bin
          go build -o ./bin/cairn ./
          ./bin/cairn collect \
            --config demo/uv-demo/cairn.toml \
            --out demo-artifacts/run-record.json \
            --run-id "${{ github.run_id }}-py312" \
            --sha-full "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --matrix "python=3.12"

      - uses: ./
        with:
          ingest-file: demo-artifacts/run-record.json

      - name: Checkout gh-pages for deployment
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-public
          fetch-depth: 0

      - name: Rebuild report shell with current source
        run: |
          mkdir -p bin
          go build -o ./bin/cairn ./
          ./bin/cairn report --pages-dir gh-pages-public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-public

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

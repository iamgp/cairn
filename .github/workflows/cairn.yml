name: Cairn Demo (uv + pytest + ruff)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: demo/uv-demo/uv.lock

      - name: Install demo dependencies
        run: uv sync --project demo/uv-demo --group dev

      - name: Run pytest (JUnit XML)
        continue-on-error: true
        run: |
          mkdir -p demo-artifacts
          PYTHONPATH=demo/uv-demo/src \
            uv run --project demo/uv-demo pytest --junitxml demo-artifacts/pytest-junit.xml

      - name: Run ruff (JSON)
        run: |
          PYTHONPATH=demo/uv-demo/src \
            uv run --project demo/uv-demo ruff check demo/uv-demo/src --output-format json --output-file demo-artifacts/ruff-results.json

      - name: Build Cairn run record
        run: |
          mkdir -p bin
          go build -o ./bin/cairn ./
          ./bin/cairn collect \
            --config demo/uv-demo/cairn.toml \
            --out demo-artifacts/run-record.json \
            --run-id "${{ github.run_id }}-py312" \
            --sha-full "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --matrix "python=3.12" \
            --requirement-id "REQ-PY-TESTS-001" \
            --artifact "pytest=demo-artifacts/pytest-junit.xml" \
            --artifact "ruff=demo-artifacts/ruff-results.json" \
            --coverage "overall:line=924/1000" \
            --tool-version "python=3.12" \
            --tool-version "ruff=latest" \
            --dependency-hash "uv.lock=${{ hashFiles('demo/uv-demo/uv.lock') }}"

      - uses: ./
        if: github.event_name != 'pull_request'
        with:
          ingest-file: demo-artifacts/run-record.json
          cairn-path: ./bin/cairn

      - uses: ./
        if: github.event_name == 'pull_request'
        with:
          ingest-file: demo-artifacts/run-record.json
          cairn-path: ./bin/cairn
          pages-subdir: previews/pr-${{ github.event.pull_request.number }}

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages-preview
      url: ${{ steps.deploy-pages.outputs.page_url }}previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout gh-pages for deployment
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-public
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-public

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

  deploy-production:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Checkout gh-pages for deployment
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-public
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-public

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

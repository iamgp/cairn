name: "Cairn Collect + Ingest to gh-pages"
description: "Download cairn, optionally collect a run record, ingest into gh-pages history, and publish updates"

inputs:
  ingest-file:
    description: "Path to a prebuilt run record JSON file to ingest (optional when collect-config is set)"
    required: false
    default: ""
  collect-config:
    description: "Path to cairn.toml to run `cairn collect` inside this action"
    required: false
    default: ""
  collect-out:
    description: "Optional output path for collected run record (defaults to $RUNNER_TEMP/cairn-run-record.json)"
    required: false
    default: ""
  collect-args:
    description: "Optional extra flags appended to `cairn collect` (for example: --matrix python=3.12 --coverage-file coverage.xml)"
    required: false
    default: ""
  collect-matrix-json:
    description: "Optional matrix context JSON (for example: {\"python\":\"3.12\"}) to auto-add --matrix entries"
    required: false
    default: ""
  auto-tool-versions:
    description: "Auto-detect common tool versions (python, uv, ruff, ty, node, npm, go) and attach as --tool-version flags"
    required: false
    default: "true"
  auto-dependency-hashes:
    description: "Auto-hash common dependency lockfiles and attach as --dependency-hash flags"
    required: false
    default: "true"
  gh-pages-branch:
    description: "Branch that stores the published cairn history"
    required: false
    default: "gh-pages"
  cairn-version:
    description: "Release tag to download (use 'latest' for the newest release)"
    required: false
    default: "latest"
  cairn-path:
    description: "Optional path to a prebuilt cairn binary to use instead of downloading a release asset"
    required: false
    default: ""
  commit-message:
    description: "Commit message for gh-pages updates"
    required: false
    default: "cairn: ingest run record"
  pages-subdir:
    description: "Optional subdirectory under gh-pages to publish into (for example: previews/pr-123)"
    required: false
    default: ""
  deploy-pages:
    description: "Whether to deploy GitHub Pages after ingest/build (requires pages + id-token permissions)"
    required: false
    default: "true"
  post-pr-comment:
    description: "Whether to render and upsert a Cairn PR comment on pull_request events"
    required: false
    default: "true"
  comment-token:
    description: "Optional token for PR comments (use a Cairn bot/App token to comment as Cairn instead of github-actions[bot])"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout gh-pages branch
      id: checkout-pages
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.gh-pages-branch }}
        path: gh-pages
        fetch-depth: 0

    - name: Bootstrap missing gh-pages branch
      if: ${{ steps.checkout-pages.outcome == 'failure' }}
      uses: actions/checkout@v4
      with:
        path: gh-pages
        fetch-depth: 0

    - name: Download cairn binary
      if: ${{ inputs.cairn-path == '' }}
      shell: bash
      run: |
        set -euo pipefail

        case "${RUNNER_OS}" in
          Linux) os="linux" ;;
          macOS) os="darwin" ;;
          Windows) os="windows" ;;
          *)
            echo "Unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

        case "${RUNNER_ARCH}" in
          X64) arch="amd64" ;;
          ARM64) arch="arm64" ;;
          X86) arch="386" ;;
          *)
            echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        version="${{ inputs.cairn-version }}"
        release_repo="iamgp/cairn"
        if [ "${version}" = "latest" ]; then
          release_base_url="https://github.com/${release_repo}/releases/latest/download"
        else
          release_base_url="https://github.com/${release_repo}/releases/download/${version}"
        fi

        extension=""
        if [ "${os}" = "windows" ]; then
          extension=".exe"
        fi

        tmp_dir="${RUNNER_TEMP}/cairn-bin"
        rm -rf "${tmp_dir}"
        mkdir -p "${tmp_dir}"

        candidates=(
          "cairn-${os}-${arch}.tar.gz"
          "cairn_${os}_${arch}.tar.gz"
          "cairn-${os}-${arch}${extension}"
          "cairn_${os}_${arch}${extension}"
        )

        downloaded=""
        for asset in "${candidates[@]}"; do
          url="${release_base_url}/${asset}"
          target="${tmp_dir}/${asset}"
          if curl -fsSL "${url}" -o "${target}"; then
            downloaded="${target}"
            break
          fi
        done

        if [ -z "${downloaded}" ]; then
          echo "Unable to download cairn release asset for ${os}/${arch} from ${release_base_url}" >&2
          exit 1
        fi

        if [[ "${downloaded}" == *.tar.gz ]]; then
          tar -xzf "${downloaded}" -C "${tmp_dir}"
          cairn_path="$(find "${tmp_dir}" -type f -name "cairn${extension}" | head -n 1)"
        else
          cairn_path="${downloaded}"
        fi

        if [ -z "${cairn_path}" ] || [ ! -f "${cairn_path}" ]; then
          echo "Downloaded asset did not contain cairn${extension}" >&2
          exit 1
        fi

        install_dir="${RUNNER_TEMP}/cairn-install"
        mkdir -p "${install_dir}"
        cp "${cairn_path}" "${install_dir}/cairn${extension}"
        chmod +x "${install_dir}/cairn${extension}"

        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Use provided cairn binary
      if: ${{ inputs.cairn-path != '' }}
      shell: bash
      run: |
        set -euo pipefail
        cairn_path="${{ inputs.cairn-path }}"
        if [ ! -f "${cairn_path}" ]; then
          echo "Provided cairn-path does not exist: ${cairn_path}" >&2
          exit 1
        fi
        install_dir="${RUNNER_TEMP}/cairn-install"
        mkdir -p "${install_dir}"
        cp "${cairn_path}" "${install_dir}/cairn"
        chmod +x "${install_dir}/cairn"
        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Ingest run record
      id: prepare-run-record
      shell: bash
      run: |
        set -euo pipefail

        run_record_path="${{ inputs.ingest-file }}"
        collect_config="${{ inputs.collect-config }}"
        collect_out="${{ inputs.collect-out }}"
        collect_args="${{ inputs.collect-args }}"
        collect_matrix_json="${{ inputs.collect-matrix-json }}"
        auto_tool_versions="${{ inputs.auto-tool-versions }}"
        auto_dependency_hashes="${{ inputs.auto-dependency-hashes }}"

        if [ -n "${collect_config}" ]; then
          if [ -z "${collect_out}" ]; then
            collect_out="${RUNNER_TEMP}/cairn-run-record.json"
          fi
          mkdir -p "$(dirname "${collect_out}")"

          auto_args=""
          if [ "${auto_tool_versions}" = "true" ]; then
            if command -v python >/dev/null 2>&1; then
              python_version="$(python --version 2>&1 | awk '{print $2}')"
              if [ -n "${python_version}" ]; then
                auto_args="${auto_args} --tool-version python=${python_version}"
              fi
            fi
            if command -v uv >/dev/null 2>&1; then
              uv_version="$(uv --version 2>/dev/null | awk '{print $2}')"
              if [ -n "${uv_version}" ]; then
                auto_args="${auto_args} --tool-version uv=${uv_version}"
              fi
            fi
            if command -v ruff >/dev/null 2>&1; then
              ruff_version="$(ruff --version 2>/dev/null | awk '{print $2}')"
              if [ -n "${ruff_version}" ]; then
                auto_args="${auto_args} --tool-version ruff=${ruff_version}"
              fi
            fi
            if command -v ty >/dev/null 2>&1; then
              ty_version="$(ty --version 2>/dev/null | awk '{print $2}')"
              if [ -n "${ty_version}" ]; then
                auto_args="${auto_args} --tool-version ty=${ty_version}"
              fi
            fi
            if command -v node >/dev/null 2>&1; then
              node_version="$(node --version 2>/dev/null | sed 's/^v//')"
              if [ -n "${node_version}" ]; then
                auto_args="${auto_args} --tool-version node=${node_version}"
              fi
            fi
            if command -v npm >/dev/null 2>&1; then
              npm_version="$(npm --version 2>/dev/null)"
              if [ -n "${npm_version}" ]; then
                auto_args="${auto_args} --tool-version npm=${npm_version}"
              fi
            fi
            if command -v go >/dev/null 2>&1; then
              go_version="$(go version 2>/dev/null | awk '{print $3}' | sed 's/^go//')"
              if [ -n "${go_version}" ]; then
                auto_args="${auto_args} --tool-version go=${go_version}"
              fi
            fi
          fi

          if [ "${auto_dependency_hashes}" = "true" ]; then
            hash_file() {
              local target="$1"
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "${target}" | awk '{print $1}'
              elif command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "${target}" | awk '{print $1}'
              else
                openssl dgst -sha256 "${target}" | awk '{print $NF}'
              fi
            }

            lockfiles=(
              "uv.lock"
              "poetry.lock"
              "requirements.txt"
              "requirements-dev.txt"
              "Pipfile.lock"
              "package-lock.json"
              "pnpm-lock.yaml"
              "yarn.lock"
              "go.sum"
              "Cargo.lock"
              "Gemfile.lock"
            )
            for file in "${lockfiles[@]}"; do
              if [ -f "${file}" ]; then
                digest="$(hash_file "${file}")"
                if [ -n "${digest}" ]; then
                  auto_args="${auto_args} --dependency-hash ${file}=${digest}"
                fi
              fi
            done
          fi

          if [ -n "${collect_matrix_json}" ]; then
            if command -v python3 >/dev/null 2>&1; then
              matrix_flags="$(python3 -c 'import json,sys; payload=json.loads(sys.argv[1]); print(" ".join([f\"--matrix {k}={v}\" for k, v in payload.items() if v is not None]))' "${collect_matrix_json}")"
              if [ -n "${matrix_flags}" ]; then
                auto_args="${auto_args} ${matrix_flags}"
              fi
            else
              echo "collect-matrix-json was set but python3 is unavailable for parsing." >&2
              exit 1
            fi
          fi

          if [ -n "${auto_args}" ] || [ -n "${collect_args}" ]; then
            # shellcheck disable=SC2086
            cairn collect --config "${collect_config}" --out "${collect_out}" ${auto_args} ${collect_args}
          else
            cairn collect --config "${collect_config}" --out "${collect_out}"
          fi

          run_record_path="${collect_out}"
        fi

        if [ -z "${run_record_path}" ]; then
          echo "Either ingest-file or collect-config must be provided." >&2
          exit 1
        fi
        if [ ! -f "${run_record_path}" ]; then
          echo "Run record not found: ${run_record_path}" >&2
          exit 1
        fi

        echo "path=${run_record_path}" >> "${GITHUB_OUTPUT}"

    - name: Ingest run record
      shell: bash
      run: |
        set -euo pipefail
        base_pages_dir="${{ github.workspace }}/gh-pages"
        pages_subdir="${{ inputs.pages-subdir }}"
        pages_subdir="${pages_subdir#/}"
        pages_subdir="${pages_subdir%/}"
        publish_dir="${base_pages_dir}"
        if [ -n "${pages_subdir}" ]; then
          publish_dir="${base_pages_dir}/${pages_subdir}"
        fi
        mkdir -p "${publish_dir}"
        cairn ingest "${{ steps.prepare-run-record.outputs.path }}" --pages-dir "${publish_dir}"

        collect_config="${{ inputs.collect-config }}"
        max_days=0
        max_runs=0
        if [ -n "${collect_config}" ] && [ -f "${collect_config}" ] && command -v python3 >/dev/null 2>&1; then
          readarray -t history_limits < <(
            CAIRN_CONFIG_PATH="${collect_config}" python3 -c 'import os,tomllib; path=os.environ.get("CAIRN_CONFIG_PATH",""); data=tomllib.load(open(path,"rb")) if path else {}; history=data.get("history") or {}; to_int=lambda value: int(value) if str(value).lstrip("+-").isdigit() else 0; max_days=to_int(history.get("max_days", 0) or 0); max_runs=to_int(history.get("max_runs", 0) or 0); print(max_days if max_days > 0 else 0); print(max_runs if max_runs > 0 else 0)'
          )

          if [ "${#history_limits[@]}" -ge 2 ]; then
            max_days="${history_limits[0]}"
            max_runs="${history_limits[1]}"
          fi
        fi

        if [ "${max_days}" -gt 0 ] || [ "${max_runs}" -gt 0 ]; then
          prune_args=(prune --pages-dir "${publish_dir}")
          if [ "${max_days}" -gt 0 ]; then
            prune_args+=(--max-days "${max_days}")
          fi
          if [ "${max_runs}" -gt 0 ]; then
            prune_args+=(--max-runs "${max_runs}")
          fi
          cairn "${prune_args[@]}"
        fi

    - name: Setup Node for web report
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Build report web assets
      shell: bash
      run: |
        set -euo pipefail

        action_root="${{ github.action_path }}"
        base_pages_dir="${{ github.workspace }}/gh-pages"
        pages_subdir="${{ inputs.pages-subdir }}"
        pages_subdir="${pages_subdir#/}"
        pages_subdir="${pages_subdir%/}"
        pages_dir="${base_pages_dir}"
        if [ -n "${pages_subdir}" ]; then
          pages_dir="${base_pages_dir}/${pages_subdir}"
        fi
        mkdir -p "${pages_dir}"

        if [ -f "${action_root}/web/package.json" ]; then
          cd "${action_root}/web"
          npm ci --no-audit --no-fund
          npm run build:pages
          cp -R .output/public/. "${pages_dir}/"
        else
          echo "Missing web report sources at ${action_root}/web; cannot build TanStack report assets." >&2
          exit 1
        fi

    - name: Commit and push gh-pages changes
      id: commit-pages
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}/gh-pages"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A

        if git diff --cached --quiet; then
          echo "No gh-pages changes to commit"
          echo "changed=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        git commit -m "${{ inputs.commit-message }}"
        git push origin "HEAD:${{ inputs.gh-pages-branch }}"
        echo "changed=true" >> "${GITHUB_OUTPUT}"

    - name: Configure Pages
      if: ${{ inputs.deploy-pages == 'true' && steps.commit-pages.outputs.changed == 'true' }}
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: ${{ inputs.deploy-pages == 'true' && steps.commit-pages.outputs.changed == 'true' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: gh-pages

    - name: Deploy Pages
      if: ${{ inputs.deploy-pages == 'true' && steps.commit-pages.outputs.changed == 'true' }}
      uses: actions/deploy-pages@v4

    - name: Render PR comment
      if: ${{ inputs.post-pr-comment == 'true' && github.event_name == 'pull_request' }}
      id: render-pr-comment
      shell: bash
      run: |
        set -euo pipefail

        run_record_path="${{ steps.prepare-run-record.outputs.path }}"
        run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("run_id",""))' "${run_record_path}")"
        pages_subdir="${{ inputs.pages-subdir }}"
        pages_subdir="${pages_subdir#/}"
        pages_subdir="${pages_subdir%/}"
        report_prefix=""
        if [ -n "${pages_subdir}" ]; then
          report_prefix="/${pages_subdir}"
        fi
        report_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}${report_prefix}/#/run?run=${run_id}"

        collect_config="${{ inputs.collect-config }}"
        comment_enabled="true"
        show_coverage="true"
        show_per_matrix="true"
        if [ -n "${collect_config}" ] && [ -f "${collect_config}" ] && command -v python3 >/dev/null 2>&1; then
          readarray -t pr_comment_settings < <(
            CAIRN_CONFIG_PATH="${collect_config}" python3 -c 'import os,tomllib; path=os.environ.get("CAIRN_CONFIG_PATH",""); data=tomllib.load(open(path,"rb")) if path else {}; section=data.get("pr_comment") or {}; value=lambda key: section[key] if key in section else True; to_bool_str=lambda raw: "true" if bool(raw) else "false"; print(to_bool_str(value("enabled"))); print(to_bool_str(value("show_coverage"))); print(to_bool_str(value("show_per_matrix")))'
          )
          if [ "${#pr_comment_settings[@]}" -ge 3 ]; then
            comment_enabled="${pr_comment_settings[0]}"
            show_coverage="${pr_comment_settings[1]}"
            show_per_matrix="${pr_comment_settings[2]}"
          fi
        fi

        if [ "${comment_enabled}" != "true" ]; then
          echo "Skipping PR comment because pr_comment.enabled=false."
          echo "path=" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        comment_path="${RUNNER_TEMP}/cairn-pr-comment.md"
        base_pages_dir="${{ github.workspace }}/gh-pages"
        publish_dir="${base_pages_dir}"
        if [ -n "${pages_subdir}" ]; then
          publish_dir="${base_pages_dir}/${pages_subdir}"
        fi

        comment_args=(
          comment
          "${run_record_path}"
          --out "${comment_path}"
          --report-url "${report_url}"
          --show-coverage="${show_coverage}"
          --show-per-matrix="${show_per_matrix}"
          --pages-dir "${publish_dir}"
        )
        if [ -n "${collect_config}" ] && [ -f "${collect_config}" ]; then
          comment_args+=(--config "${collect_config}")
        fi
        cairn "${comment_args[@]}"

        echo "path=${comment_path}" >> "${GITHUB_OUTPUT}"

    - name: Upsert PR comment
      if: ${{ inputs.post-pr-comment == 'true' && github.event_name == 'pull_request' && steps.render-pr-comment.outputs.path != '' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.comment-token != '' && inputs.comment-token || github.token }}
        script: |
          const fs = require('fs')
          const issue_number = context.payload.pull_request.number
          const body = fs.readFileSync(process.env.CAIRN_COMMENT_PATH, 'utf8')
          const marker = '<!-- cairn:comment -->'
          const { owner, repo } = context.repo
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          })
          const existing = comments.find((c) => c.body && c.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            })
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            })
          }
      env:
        CAIRN_COMMENT_PATH: ${{ steps.render-pr-comment.outputs.path }}

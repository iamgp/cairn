name: "Cairn Ingest to gh-pages"
description: "Download cairn for the current runner, ingest a run record into gh-pages history, and push updates"

inputs:
  ingest-file:
    description: "Path to the run record JSON file to ingest"
    required: true
  gh-pages-branch:
    description: "Branch that stores the published cairn history"
    required: false
    default: "gh-pages"
  cairn-version:
    description: "Release tag to download (use 'latest' for the newest release)"
    required: false
    default: "latest"
  cairn-path:
    description: "Optional path to a prebuilt cairn binary to use instead of downloading a release asset"
    required: false
    default: ""
  commit-message:
    description: "Commit message for gh-pages updates"
    required: false
    default: "cairn: ingest run record"
  pages-subdir:
    description: "Optional subdirectory under gh-pages to publish into (for example: previews/pr-123)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout gh-pages branch
      id: checkout-pages
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.gh-pages-branch }}
        path: gh-pages
        fetch-depth: 0

    - name: Bootstrap missing gh-pages branch
      if: ${{ steps.checkout-pages.outcome == 'failure' }}
      uses: actions/checkout@v4
      with:
        path: gh-pages
        fetch-depth: 0

    - name: Download cairn binary
      if: ${{ inputs.cairn-path == '' }}
      shell: bash
      run: |
        set -euo pipefail

        case "${RUNNER_OS}" in
          Linux) os="linux" ;;
          macOS) os="darwin" ;;
          Windows) os="windows" ;;
          *)
            echo "Unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

        case "${RUNNER_ARCH}" in
          X64) arch="amd64" ;;
          ARM64) arch="arm64" ;;
          X86) arch="386" ;;
          *)
            echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        version="${{ inputs.cairn-version }}"
        release_repo="iamgp/cairn"
        if [ "${version}" = "latest" ]; then
          release_base_url="https://github.com/${release_repo}/releases/latest/download"
        else
          release_base_url="https://github.com/${release_repo}/releases/download/${version}"
        fi

        extension=""
        if [ "${os}" = "windows" ]; then
          extension=".exe"
        fi

        tmp_dir="${RUNNER_TEMP}/cairn-bin"
        rm -rf "${tmp_dir}"
        mkdir -p "${tmp_dir}"

        candidates=(
          "cairn-${os}-${arch}.tar.gz"
          "cairn_${os}_${arch}.tar.gz"
          "cairn-${os}-${arch}${extension}"
          "cairn_${os}_${arch}${extension}"
        )

        downloaded=""
        for asset in "${candidates[@]}"; do
          url="${release_base_url}/${asset}"
          target="${tmp_dir}/${asset}"
          if curl -fsSL "${url}" -o "${target}"; then
            downloaded="${target}"
            break
          fi
        done

        if [ -z "${downloaded}" ]; then
          echo "Unable to download cairn release asset for ${os}/${arch} from ${release_base_url}" >&2
          exit 1
        fi

        if [[ "${downloaded}" == *.tar.gz ]]; then
          tar -xzf "${downloaded}" -C "${tmp_dir}"
          cairn_path="$(find "${tmp_dir}" -type f -name "cairn${extension}" | head -n 1)"
        else
          cairn_path="${downloaded}"
        fi

        if [ -z "${cairn_path}" ] || [ ! -f "${cairn_path}" ]; then
          echo "Downloaded asset did not contain cairn${extension}" >&2
          exit 1
        fi

        install_dir="${RUNNER_TEMP}/cairn-install"
        mkdir -p "${install_dir}"
        cp "${cairn_path}" "${install_dir}/cairn${extension}"
        chmod +x "${install_dir}/cairn${extension}"

        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Use provided cairn binary
      if: ${{ inputs.cairn-path != '' }}
      shell: bash
      run: |
        set -euo pipefail
        cairn_path="${{ inputs.cairn-path }}"
        if [ ! -f "${cairn_path}" ]; then
          echo "Provided cairn-path does not exist: ${cairn_path}" >&2
          exit 1
        fi
        install_dir="${RUNNER_TEMP}/cairn-install"
        mkdir -p "${install_dir}"
        cp "${cairn_path}" "${install_dir}/cairn"
        chmod +x "${install_dir}/cairn"
        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Ingest run record
      shell: bash
      run: |
        set -euo pipefail
        base_pages_dir="${{ github.workspace }}/gh-pages"
        pages_subdir="${{ inputs.pages-subdir }}"
        pages_subdir="${pages_subdir#/}"
        pages_subdir="${pages_subdir%/}"
        publish_dir="${base_pages_dir}"
        if [ -n "${pages_subdir}" ]; then
          publish_dir="${base_pages_dir}/${pages_subdir}"
        fi
        mkdir -p "${publish_dir}"
        cairn ingest "${{ inputs.ingest-file }}" --pages-dir "${publish_dir}"

    - name: Setup Node for web report
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Build report web assets
      shell: bash
      run: |
        set -euo pipefail

        action_root="${{ github.action_path }}"
        base_pages_dir="${{ github.workspace }}/gh-pages"
        pages_subdir="${{ inputs.pages-subdir }}"
        pages_subdir="${pages_subdir#/}"
        pages_subdir="${pages_subdir%/}"
        pages_dir="${base_pages_dir}"
        if [ -n "${pages_subdir}" ]; then
          pages_dir="${base_pages_dir}/${pages_subdir}"
        fi
        mkdir -p "${pages_dir}"

        if [ -f "${action_root}/web/package.json" ]; then
          cd "${action_root}/web"
          npm install --no-audit --no-fund
          npm run build:pages
          cp -R .output/public/. "${pages_dir}/"
        else
          echo "Missing web report sources at ${action_root}/web; cannot build TanStack report assets." >&2
          exit 1
        fi

    - name: Commit and push gh-pages changes
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}/gh-pages"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A

        if git diff --cached --quiet; then
          echo "No gh-pages changes to commit"
          exit 0
        fi

        git commit -m "${{ inputs.commit-message }}"
        git push origin "HEAD:${{ inputs.gh-pages-branch }}"
